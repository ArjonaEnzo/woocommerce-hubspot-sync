# Local demo stack: WooCommerce (HPOS) + n8n on one network.
# WordPress: http://localhost:8080  ·  n8n: http://localhost:5679
# From n8n, WordPress is http://wordpress ; from WordPress, n8n is http://n8n:5678
name: woo-hubspot

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:7.0-php8.3-apache
    restart: unless-stopped
    depends_on: [db]
    ports: ["127.0.0.1:8080:80"] # localhost only
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      # "local" enables WP Application Passwords over plain HTTP (used by n8n).
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
    volumes:
      - wp_data:/var/www/html
      - ./wordpress/mu-plugins:/var/www/html/wp-content/mu-plugins:ro

  # One-off WP-CLI container: docker compose run --rm wpcli wp <command>
  wpcli:
    image: wordpress:cli-php8.3
    profiles: [tools]
    user: "33:33" # same uid as Apache's www-data in the wordpress image
    depends_on: [db]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_data:/var/www/html
      - ./wordpress/mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      - ./wordpress/cli:/cli:ro
      - ./data:/data:ro

  n8n:
    image: n8nio/n8n:2.48.5
    restart: unless-stopped
    ports: ["127.0.0.1:5679:5678"] # 5679 on the host avoids clashing with another local n8n
    environment:
      GENERIC_TIMEZONE: America/Argentina/Buenos_Aires
      TZ: America/Argentina/Buenos_Aires
      N8N_SECURE_COOKIE: "false"
      N8N_EDITOR_BASE_URL: http://localhost:5679
      # No phoning home: faster CLI start-up and nothing leaves the machine.
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      # Workflows read these via $env (values come from .env through Compose interpolation).
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      WOO_BASE_URL: http://wordpress
      WOO_WEBHOOK_SECRET: ${WOO_WEBHOOK_SECRET:-}
      # Point to http://hubspot-mock:4010 to run the whole flow without a HubSpot account.
      HUBSPOT_BASE_URL: ${HUBSPOT_BASE_URL:-https://api.hubapi.com}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows/dist:/workflows:ro

  # Offline stand-in for the HubSpot endpoints the sync uses (tests, CI, demos without an account).
  hubspot-mock:
    image: node:24-alpine
    profiles: [mock]
    command: ["node", "/app/scripts/hubspot-mock.mjs"]
    environment:
      PORT: "4010"
    ports: ["127.0.0.1:4010:4010"]
    volumes:
      - ./:/app:ro

volumes:
  db_data:
  wp_data:
  n8n_data:
